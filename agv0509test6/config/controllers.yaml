controller_manager:
  ros__parameters:

    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


diff_drive_controller:
  ros__parameters:

    # ============================================================
    # Wheels
    # ============================================================

    left_wheel_names:
      - left_wheel_jt

    right_wheel_names:
      - right_wheel_jt

    wheels_per_side: 1

    wheel_separation: 0.586
    wheel_radius: 0.100

    # Calibration factors
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0


    # ============================================================
    # Odometry
    # ============================================================

    publish_rate: 50.0

    odom_frame_id: odom
    base_frame_id: base_footprint

    # EKF publishes odom -> base_footprint
    enable_odom_tf: false

    # Use wheel feedback for odometry
    open_loop: false
    position_feedback: true

    velocity_rolling_window_size: 5


    # ============================================================
    # Velocity command
    # ============================================================

    # MPC publishes geometry_msgs/Twist to:
    # /diff_drive_controller/cmd_vel_unstamped
    use_stamped_vel: false

    cmd_vel_timeout: 0.5

    # Publish command after controller limits
    publish_limited_velocity: true


    # ============================================================
    # Velocity limits
    # ============================================================

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.5
    linear.x.min_velocity: -0.5

    linear.x.has_acceleration_limits: false
    linear.x.has_jerk_limits: false

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0

    angular.z.has_acceleration_limits: false
    angular.z.has_jerk_limits: false


    # ============================================================
    # Odometry covariance
    # ============================================================

    pose_covariance_diagonal:
      - 0.001
      - 0.001
      - 1000000.0
      - 1000000.0
      - 1000000.0
      - 0.03

    twist_covariance_diagonal:
      - 0.001
      - 0.001
      - 1000000.0
      - 1000000.0
      - 1000000.0
      - 0.03