ekf_filter_node:
  ros__parameters:

    # ============================================================
    # General
    # ============================================================

    use_sim_time: true

    frequency: 50.0

    sensor_timeout: 0.1

    two_d_mode: true

    publish_tf: true

    publish_acceleration: false

    print_diagnostics: true

    debug: false

    # Useful when Gazebo /clock jumps backwards after reset
    reset_on_time_jump: true


    # ============================================================
    # Frames
    # ============================================================

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint

    # EKF provides local continuous odometry
    world_frame: odom


    # ============================================================
    # Wheel Odometry
    # ============================================================

    odom0: /diff_drive_controller/odom

    # State ordering:
    # x, y, z,
    # roll, pitch, yaw,
    # vx, vy, vz,
    # vroll, vpitch, vyaw,
    # ax, ay, az

    # Fuse:
    # vx
    # vy = 0  -> nonholonomic constraint
    # yaw rate
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, true,
      false, false, false
    ]

    odom0_differential: false
    odom0_relative: false

    odom0_queue_size: 10


    # ============================================================
    # IMU
    # ============================================================

    imu0: /imu/data

    # Fuse only yaw angular velocity from the IMU
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]

    imu0_differential: false
    imu0_relative: false

    imu0_queue_size: 20

    imu0_remove_gravitational_acceleration: false