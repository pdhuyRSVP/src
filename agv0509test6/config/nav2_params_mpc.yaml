# =============================================================================
# nav2_params_mpc.yaml
# Controller: Model Predictive Control (MPC)
# Robot     : Differential Drive (2-wheel)
# Simulator : Gazebo Classic
# Goal      : Minimize x/y/yaw errors — maximum stability & precision
# Tuned for : Nav2 Humble
# =============================================================================

# =============================================================================
# LOCAL COSTMAP
# =============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[ [0.410, 0.357], [0.410, -0.357], [-0.410, -0.357], [-0.410, 0.357] ]"
      rolling_window: True
      always_send_full_costmap: True
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          obstacle_min_range: 0.15
          obstacle_max_range: 6.0
          raytrace_min_range: 0.15
          raytrace_max_range: 6.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 4.0

# =============================================================================
# GLOBAL COSTMAP
# =============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      width: 20
      height: 20
      resolution: 0.05
      footprint: "[ [0.410, 0.357], [0.410, -0.357], [-0.410, -0.357], [-0.410, 0.357] ]"
      rolling_window: False
      track_unknown_space: True
      always_send_full_costmap: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        subscribe_to_updates: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          obstacle_min_range: 0.15
          obstacle_max_range: 6.5
          raytrace_min_range: 0.15
          raytrace_max_range: 7.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 4.0

# =============================================================================
# MAP SERVER & SAVER
# =============================================================================
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

# =============================================================================
# PLANNER SERVER
# =============================================================================
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins:
      - GridBased
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.10
      use_astar: true
      allow_unknown: false

# =============================================================================
# SMOOTHER SERVER
# =============================================================================
smoother_server:
  ros__parameters:
    use_sim_time: true

    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint

    robot_base_frame: base_footprint
    transform_tolerance: 0.1

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

      tolerance: 1.0e-10
      max_its: 1000

      do_refinement: true
      refinement_num: 2

      w_data: 0.2
      w_smooth: 0.5

      enforce_path_inversion: false

# =============================================================================
# AMCL
# =============================================================================    
amcl:
  ros__parameters:
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: -1.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.02
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_filtered
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
