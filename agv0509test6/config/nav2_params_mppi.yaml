# =============================================================================
# nav2_params_dwb.yaml
# Controller: DWB (Dynamic Window Approach - ROS2 Nav2 implementation)
# Robot     : Differential Drive (2-wheel) with slam_toolbox
# Simulator : Gazebo Classic
# Goal      : Minimize x/y/yaw errors — maximum stability & precision
# Tuned for : Nav2 Humble
# =============================================================================

# =============================================================================
# BT Navigator
# =============================================================================
bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered

    bt_loop_duration: 10
    default_server_timeout: 20

    navigators:
      - navigate_to_pose

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

# =============================================================================
# BEHAVIOR SERVER
# =============================================================================
behavior_server:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_footprint
    local_frame: odom

    transform_tolerance: 0.2

    simulate_ahead_time: 2.0

    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.2

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

    wait:
      plugin: "nav2_behaviors/Wait"

# =============================================================================
# CONTROLLER SERVER — MPPI
# =============================================================================
controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 10.0

    odom_topic: /odometry/filtered

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    #########################################################
    # Progress Checker
    #########################################################

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0

    #########################################################
    # Goal Checker
    #########################################################

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.10
      stateful: true

    #########################################################
    # MPPI Controller
    #########################################################

    FollowPath:

      plugin: "nav2_mppi_controller::MPPIController"

      #######################################################
      # Robot model
      #######################################################

      motion_model: "DiffDrive"

      #######################################################
      # Sampling
      #######################################################

      time_steps: 20
      model_dt: 0.1

      batch_size: 2000

      iteration_count: 1

      #######################################################
      # Temperature
      #######################################################

      temperature: 0.3

      gamma: 0.015

      #######################################################
      # Velocity limits
      #######################################################

      vx_max: 0.50
      vx_min: -0.20

      vy_max: 0.0

      wz_max: 1.0

      #######################################################
      # Acceleration limits
      #######################################################

      ax_max: 2.5
      ax_min: -2.5

      az_max: 3.2

      #######################################################
      # Pruning
      #######################################################

      prune_distance: 1.7

      transform_tolerance: 0.2

      #######################################################
      # Goal tolerance
      #######################################################

      xy_goal_tolerance: 0.15

      #######################################################
      # Visualization
      #######################################################

      visualize: false

      #######################################################
      # Trajectory validator
      #######################################################

      enforce_path_inversion: false

      reset_period: 1.0

      regenerate_noises: false

      #######################################################
      # Critics
      #######################################################

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic

      #######################################################
      # Constraint
      #######################################################

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      #######################################################
      # Obstacle
      #######################################################

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.8
        critical_cost: 300.0
        collision_cost: 1000000.0
        near_goal_distance: 0.5

      #######################################################
      # Goal
      #######################################################

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      #######################################################
      # Goal heading
      #######################################################

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      #######################################################
      # Follow path
      #######################################################

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0

      #######################################################
      # Stay on path
      #######################################################

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4

      #######################################################
      # Heading along path
      #######################################################

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0

      #######################################################
      # Prefer forward motion
      #######################################################

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0

# =============================================================================
# LOCAL COSTMAP
# =============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[ [0.410, 0.357], [0.410, -0.357], [-0.410, -0.357], [-0.410, 0.357] ]"
      rolling_window: True
      always_send_full_costmap: True
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          obstacle_min_range: 0.15
          obstacle_max_range: 6.0
          raytrace_min_range: 0.15
          raytrace_max_range: 6.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 4.0

# =============================================================================
# GLOBAL COSTMAP
# =============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      width: 20
      height: 20
      resolution: 0.05
      footprint: "[ [0.410, 0.357], [0.410, -0.357], [-0.410, -0.357], [-0.410, 0.357] ]"
      rolling_window: False
      track_unknown_space: True
      always_send_full_costmap: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        subscribe_to_updates: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          obstacle_min_range: 0.15
          obstacle_max_range: 6.5
          raytrace_min_range: 0.15
          raytrace_max_range: 7.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.50
        cost_scaling_factor: 4.0

# =============================================================================
# MAP SERVER & SAVER
# =============================================================================
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

# =============================================================================
# PLANNER SERVER
# =============================================================================
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins:
      - GridBased
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.10
      use_astar: true
      allow_unknown: false
    
# =============================================================================
# AMCL
# =============================================================================    
amcl:
  ros__parameters:
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: -1.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.02
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_filtered
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
